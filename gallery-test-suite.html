<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery System Test - Beyond Detail</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .test-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .test-card {
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s;
        }

        .test-card.pass {
            border-color: #28a745;
            background: #d4edda;
        }

        .test-card.fail {
            border-color: #dc3545;
            background: #f8d7da;
        }

        .test-card.pending {
            border-color: #ffc107;
            background: #fff3cd;
        }

        .test-card h3 {
            margin-bottom: 10px;
            color: #333;
        }

        .test-status {
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .test-details {
            font-size: 0.9em;
            color: #666;
            margin-top: 10px;
        }

        .test-details div {
            margin: 5px 0;
        }

        .overall-status {
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            font-size: 1.2em;
            font-weight: 600;
            text-align: center;
        }

        .overall-status.pass {
            background: #28a745;
            color: white;
        }

        .overall-status.fail {
            background: #dc3545;
            color: white;
        }

        .overall-status.pending {
            background: #ffc107;
            color: #333;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            margin-right: 10px;
            transition: background 0.3s;
        }

        button:hover {
            background: #5568d3;
        }

        .error-list {
            background: #f8d7da;
            border: 2px solid #dc3545;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
        }

        .error-list h3 {
            color: #721c24;
            margin-bottom: 10px;
        }

        .error-list ul {
            margin-left: 20px;
            color: #721c24;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .summary-card {
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .summary-card.pass {
            background: #d4edda;
            color: #155724;
        }

        .summary-card.fail {
            background: #f8d7da;
            color: #721c24;
        }

        .summary-card.total {
            background: #d1ecf1;
            color: #0c5460;
        }

        .summary-card .number {
            font-size: 3em;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .summary-card .label {
            font-size: 1.1em;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🧪 Gallery System Test Suite</h1>
        <p class="subtitle">Comprehensive testing of all gallery functionality</p>

        <div id="overall-status" class="overall-status pending">
            ⏳ Running tests...
        </div>

        <div id="summary" class="summary"></div>

        <div>
            <button onclick="runTests()">🔄 Run Tests</button>
            <button onclick="location.href='gallery-diagnostic.html'">📊 View Diagnostic Tool</button>
        </div>

        <div id="test-results" class="test-grid"></div>

        <div id="errors"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@sanity/client@6.8.6/dist/index.browser.min.js"></script>
    <script>
        const client = sanityClient({
            projectId: 'trp6l9ar',
            dataset: 'production',
            apiVersion: '2023-05-03',
            useCdn: false,
        });

        const serviceTypes = [
            { name: 'Window Tint', value: 'tint' },
            { name: 'Auto Detail', value: 'auto-detail' },
            { name: 'Paint Correction', value: 'paint-correction' },
            { name: 'Ceramic Coating', value: 'ceramic-coating' },
            { name: 'Interior Detailing', value: 'interior-detailing' },
            { name: 'Exterior Detailing', value: 'exterior-detailing' },
            { name: 'Headlight Restoration', value: 'headlight-restoration' },
            { name: 'Odour Removal', value: 'odour-removal' },
            { name: 'Leather Cleaning', value: 'leather-cleaning' },
            { name: 'Paint Removal', value: 'paint-removal' },
            { name: 'Fleet Services', value: 'fleet-services' },
        ];

        async function runTests() {
            const resultsEl = document.getElementById('test-results');
            const overallEl = document.getElementById('overall-status');
            const summaryEl = document.getElementById('summary');
            const errorsEl = document.getElementById('errors');

            resultsEl.innerHTML = '';
            errorsEl.innerHTML = '';
            overallEl.className = 'overall-status pending';
            overallEl.textContent = '⏳ Running tests...';

            const results = [];
            const errors = [];

            for (const service of serviceTypes) {
                const result = await testServiceGallery(service);
                results.push(result);

                const card = document.createElement('div');
                card.className = `test-card ${result.status}`;

                let statusIcon = '⏳';
                if (result.status === 'pass') statusIcon = '✅';
                if (result.status === 'fail') statusIcon = '❌';

                card.innerHTML = `
                    <h3>${service.name}</h3>
                    <div class="test-status">${statusIcon} ${result.status.toUpperCase()}</div>
                    <div class="test-details">
                        <div>📸 Images Found: ${result.imageCount}</div>
                        <div>✅ Valid Images: ${result.validImages}</div>
                        <div>❌ Invalid Images: ${result.invalidImages}</div>
                        ${result.hasUnpublished ? '<div>⚠️ Has unpublished drafts</div>' : ''}
                        ${result.message ? `<div>${result.message}</div>` : ''}
                    </div>
                `;

                resultsEl.appendChild(card);

                if (result.status === 'fail') {
                    errors.push(`${service.name}: ${result.message}`);
                }
            }

            // Calculate summary
            const totalTests = results.length;
            const passedTests = results.filter(r => r.status === 'pass').length;
            const failedTests = results.filter(r => r.status === 'fail').length;

            summaryEl.innerHTML = `
                <div class="summary-card total">
                    <div class="number">${totalTests}</div>
                    <div class="label">Total Tests</div>
                </div>
                <div class="summary-card pass">
                    <div class="number">${passedTests}</div>
                    <div class="label">Passed</div>
                </div>
                <div class="summary-card fail">
                    <div class="number">${failedTests}</div>
                    <div class="label">Failed</div>
                </div>
            `;

            // Update overall status
            if (failedTests === 0) {
                overallEl.className = 'overall-status pass';
                overallEl.textContent = `✅ All ${totalTests} tests passed! Gallery system is working perfectly.`;
            } else {
                overallEl.className = 'overall-status fail';
                overallEl.textContent = `❌ ${failedTests} of ${totalTests} tests failed. See details below.`;

                errorsEl.innerHTML = `
                    <div class="error-list">
                        <h3>🐛 Issues Found:</h3>
                        <ul>
                            ${errors.map(e => `<li>${e}</li>`).join('')}
                        </ul>
                        <p style="margin-top: 15px;">
                            <strong>To fix:</strong> Open Sanity Studio, upload images to the services listed above, and publish them.
                        </p>
                    </div>
                `;
            }
        }

        async function testServiceGallery(service) {
            try {
                const query = `*[_type == "serviceGallery" && serviceType == $serviceType] {
                    _id,
                    title,
                    "hasImage": defined(image),
                    "imageUrl": image.asset->url,
                    order
                }`;

                const results = await client.fetch(query, { serviceType: service.value });

                const validImages = results.filter(r => r.hasImage && r.imageUrl).length;
                const invalidImages = results.filter(r => !r.hasImage || !r.imageUrl).length;

                // Check for drafts
                const draftQuery = `*[_type == "serviceGallery" && serviceType == $serviceType && _id in path("drafts.**")] {
                    _id
                }`;
                const drafts = await client.fetch(draftQuery, { serviceType: service.value });

                let status = 'pass';
                let message = '';

                if (results.length === 0) {
                    status = 'fail';
                    message = 'No images found for this service';
                } else if (invalidImages > 0) {
                    status = 'fail';
                    message = `${invalidImages} images missing or broken`;
                } else if (validImages < 3) {
                    status = 'pass';
                    message = `Only ${validImages} images (recommend at least 3)`;
                }

                return {
                    service: service.name,
                    status,
                    imageCount: results.length,
                    validImages,
                    invalidImages,
                    hasUnpublished: drafts.length > 0,
                    message
                };

            } catch (error) {
                return {
                    service: service.name,
                    status: 'fail',
                    imageCount: 0,
                    validImages: 0,
                    invalidImages: 0,
                    hasUnpublished: false,
                    message: `Error: ${error.message}`
                };
            }
        }

        // Run tests on page load
        runTests();
    </script>
</body>

</html>
